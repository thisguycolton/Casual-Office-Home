name: Build images

# Builds the app and collab images and publishes them to GitHub Container Registry.
# Images:  ghcr.io/<owner>/casual-office-app  and  ghcr.io/<owner>/casual-office-collab
on:
  push:
    branches: [main, claude/self-hosted-productivity-docker-x2wnre]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --prefix collab && npm test --prefix collab
      - run: npm ci --prefix app && npm test --prefix app

  images:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase image prefix and load upstream pins
        run: |
          echo "PREFIX=ghcr.io/$(echo '${{ github.repository_owner }}' | tr 'A-Z' 'a-z')" >> "$GITHUB_ENV"
          grep -E '^[A-Z_]+=' editors/pins.env >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - id: meta-app
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.PREFIX }}/casual-office-app
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta-app.outputs.tags }}
          labels: ${{ steps.meta-app.outputs.labels }}
          build-args: |
            PDF_REPO=${{ env.PDF_REPO }}
            PDF_SHA=${{ env.PDF_SHA }}
            SLIDES_REPO=${{ env.SLIDES_REPO }}
            SLIDES_SHA=${{ env.SLIDES_SHA }}
            DOCS_REPO=${{ env.DOCS_REPO }}
            DOCS_SHA=${{ env.DOCS_SHA }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max
      - id: meta-collab
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.PREFIX }}/casual-office-collab
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: collab
          push: true
          tags: ${{ steps.meta-collab.outputs.tags }}
          labels: ${{ steps.meta-collab.outputs.labels }}
          cache-from: type=gha,scope=collab
          cache-to: type=gha,scope=collab,mode=max
