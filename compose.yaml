# Self-hosted productivity suite.  Usage: see README.md
#   cp .env.example .env && edit .env
#   docker compose --env-file .env --env-file editors/pins.env up -d --build
name: casual-office

services:
  app:
    build:
      context: .
      args:
        PDF_REPO: ${PDF_REPO}
        PDF_SHA: ${PDF_SHA}
        SLIDES_REPO: ${SLIDES_REPO}
        SLIDES_SHA: ${SLIDES_SHA}
        DOCS_REPO: ${DOCS_REPO}
        DOCS_SHA: ${DOCS_SHA}
        NODE_VERSION: ${NODE_VERSION:-22.23.4-alpine}
        NODE_BUILD_IMAGE: ${NODE_BUILD_IMAGE:-22.23.4-bookworm}
    image: casual-office-app:${APP_VERSION:-dev}
    restart: unless-stopped
    environment:
      PORT: "3000"
      DATA_DIR: /data
      SECURE_COOKIES: ${SECURE_COOKIES:-true}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-500}
      USER_QUOTA_MB: ${USER_QUOTA_MB:-0}
      KEEP_VERSIONS: ${KEEP_VERSIONS:-5}
      VERSION_INTERVAL_MIN: ${VERSION_INTERVAL_MIN:-10}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-336}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      COLLAB_JWT_SECRET: ${COLLAB_JWT_SECRET:?set COLLAB_JWT_SECRET in .env (openssl rand -hex 32)}
      COLLAB_INTERNAL_URL: http://collab:1234
      COLLAB_TOKEN_TTL_HOURS: ${COLLAB_TOKEN_TTL_HOURS:-8}
    depends_on:
      collab:
        condition: service_healthy
    volumes:
      - app-data:/data
    networks: [backend]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  collab:
    build: ./collab
    image: casual-office-collab:${APP_VERSION:-dev}
    restart: unless-stopped
    environment:
      PORT: "1234"
      COLLAB_JWT_SECRET: ${COLLAB_JWT_SECRET:?set COLLAB_JWT_SECRET in .env (openssl rand -hex 32)}
      MAX_PAYLOAD_MB: ${COLLAB_MAX_PAYLOAD_MB:-32}
    # Rooms live in memory only; the file's bytes are owned by the app. Nothing is persisted here.
    networks: [backend]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:1234/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  proxy:
    image: caddy:${CADDY_VERSION}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      MAX_UPLOAD_BODY: ${MAX_UPLOAD_BODY:-1GB}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [backend, edge]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  # `backend` has no route to the internet: the app cannot be reached or reach out except via the proxy.
  backend:
    internal: true
  edge: {}

volumes:
  app-data:
  caddy-data:
  caddy-config:
