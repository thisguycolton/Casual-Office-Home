# Self-hosted productivity suite.  Usage: see README.md
#   cp .env.example .env && edit .env
#   docker compose --env-file .env --env-file editors/pins.env up -d --build
name: casual-office

services:
  app:
    build:
      context: .
      args:
        PDF_REPO: ${PDF_REPO}
        PDF_SHA: ${PDF_SHA}
        SLIDES_REPO: ${SLIDES_REPO}
        SLIDES_SHA: ${SLIDES_SHA}
        NODE_VERSION: ${NODE_VERSION:-22.23.4-alpine}
        NODE_BUILD_IMAGE: ${NODE_BUILD_IMAGE:-22.23.4-bookworm}
    image: casual-office-app:${APP_VERSION:-dev}
    restart: unless-stopped
    environment:
      PORT: "3000"
      DATA_DIR: /data
    volumes:
      - app-data:/data
    networks: [backend]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  proxy:
    image: caddy:${CADDY_VERSION}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      MAX_UPLOAD_BODY: ${MAX_UPLOAD_BODY:-1GB}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [backend, edge]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  # `backend` has no route to the internet: the app cannot be reached or reach out except via the proxy.
  backend:
    internal: true
  edge: {}

volumes:
  app-data:
  caddy-data:
  caddy-config:
